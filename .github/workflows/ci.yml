name: CI

run-name: CI / ${{ inputs.jobs }} / ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character candidate SHA reviewed for this validation"
        required: true
        type: string
      jobs:
        description: "Validation units: full, windows, linux, macos"
        required: true
        default: full
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - name: Verify exact candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_sha must be an exact 40-character SHA" >&2
            exit 1
          fi
          if [[ "${ACTUAL_SHA,,}" != "${EXPECTED_SHA,,}" ]]; then
            echo "Workflow SHA mismatch" >&2
            echo "expected: $EXPECTED_SHA" >&2
            echo "actual:   $ACTUAL_SHA" >&2
            exit 1
          fi
      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.jobs }}
        run: |
          case "$REQUESTED" in
            full) selected="windows linux macos" ;;
            windows|linux|macos) selected="$REQUESTED" ;;
            *) echo "Unknown validation unit: $REQUESTED" >&2; exit 1 ;;
          esac
          for unit in windows linux macos; do
            if [[ " $selected " == *" $unit "* ]]; then value=true; else value=false; fi
            echo "$unit=$value" >> "$GITHUB_OUTPUT"
          done

  windows:
    name: Windows MSVC x64
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DQIVEN_HOST_BUILD_TESTS=ON
      - run: cmake --build build-debug --config Debug --parallel
      - run: ctest --test-dir build-debug -C Debug --output-on-failure
      - run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DQIVEN_HOST_BUILD_TESTS=ON
      - run: cmake --build build-release --config Release --parallel
      - run: ctest --test-dir build-release -C Release --output-on-failure

  linux:
    name: Linux GCC x64
    needs: plan
    if: ${{ needs.plan.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DQIVEN_HOST_BUILD_TESTS=ON
      - run: cmake --build build-debug --config Debug --parallel
      - run: ctest --test-dir build-debug -C Debug --output-on-failure
      - run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DQIVEN_HOST_BUILD_TESTS=ON
      - run: cmake --build build-release --config Release --parallel
      - run: ctest --test-dir build-release -C Release --output-on-failure

  macos:
    name: macOS AppleClang arm64
    needs: plan
    if: ${{ needs.plan.outputs.macos == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DQIVEN_HOST_BUILD_TESTS=ON
      - run: cmake --build build-debug --config Debug --parallel
      - run: ctest --test-dir build-debug -C Debug --output-on-failure
      - run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DQIVEN_HOST_BUILD_TESTS=ON
      - run: cmake --build build-release --config Release --parallel
      - run: ctest --test-dir build-release -C Release --output-on-failure

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [plan, windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          [[ "$PLAN" == success ]]
          [[ "$WINDOWS" == success || "$WINDOWS" == skipped ]]
          [[ "$LINUX" == success || "$LINUX" == skipped ]]
          [[ "$MACOS" == success || "$MACOS" == skipped ]]
